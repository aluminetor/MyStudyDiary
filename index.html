<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Diario de Estudio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="contenedor">
    <h1>Diario de Estudio</h1>

    <section class="racha">
      <p class="racha-etiqueta">Racha actual</p>
      <p class="racha-valor"><span id="racha">0</span> 🔥</p>
      <p class="racha-detalle" id="racha-detalle">días seguidos estudiando</p>
      <p class="mejor-racha">Mejor racha: <span id="mejor-racha">0</span> <span id="mejor-racha-unidad">días</span> 🏆</p>
      <p class="mejor-racha">Esta semana (<span id="rango-semana"></span>): <span id="minutos-semana">0</span> min ⏱️</p>
    </section>

    <section class="tarjeta">
      <h2>Nueva sesión</h2>
      <form id="form-sesion">
        <label for="fecha">Fecha</label>
        <input type="date" id="fecha" name="fecha" required>

        <label for="tema">Tema</label>
        <input type="text" id="tema" name="tema" placeholder="¿Qué estudiaste?" required>

        <label for="minutos">Minutos</label>
        <input type="number" id="minutos" name="minutos" min="1" step="1" placeholder="Ej: 30" required>

        <p class="error" id="error" hidden></p>

        <button type="submit">Guardar sesión</button>
      </form>
    </section>

    <section class="tarjeta">
      <h2>Mis sesiones</h2>
      <ul id="lista" class="lista"></ul>
      <p id="vacio" class="vacio">Todavía no hay sesiones. ¡Registra la primera!</p>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
